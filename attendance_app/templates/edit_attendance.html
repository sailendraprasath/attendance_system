<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Edit Attendance</title>

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        font-family: Arial, sans-serif;
        min-height: 100vh;
        margin: 0;
        position: relative;
        background: #fff; /* fallback */
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 40px 0;
      }

      /* Grid + radial overlay */
      body::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background:
          linear-gradient(to right, #4f4f4f2e 1px, transparent 1px),
          linear-gradient(to bottom, #4f4f4f2e 1px, transparent 1px);
        background-size: 14px 24px;
        mask-image: radial-gradient(
          ellipse 80% 50% at 50% 0%,
          #000 70%,
          transparent 110%
        );
        -webkit-mask-image: radial-gradient(
          ellipse 80% 50% at 50% 0%,
          #000 70%,
          transparent 110%
        );
        pointer-events: none;
        z-index: 0;
      }

      .card {
        position: relative;
        z-index: 1; /* above background */
      }

      .card-header {
        background: linear-gradient(185deg, #4e73df, #2e59d9);
        color: #fff;
      }

      .form-control {
        background-color: #fcf6f6;
        color: #000000;
        border: 1px solid #555;
      }

      .form-control:focus {
        background-color: #ffffff;
        color: #000;
        border-color: #4e73df;
        box-shadow: 0 0 0 0.2rem rgba(78, 115, 223, 0.4);
      }

      .btn-success {
        background-color: #27ae60;
        border: none;
      }

      .btn-success:hover {
        background-color: #1e8449;
      }

      .btn-secondary {
        border: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card shadow">
        <!-- Card Header -->
        <div class="card-header">
          <h4>Edit Attendance for {{ attendance.employee.username }} on</h4>
          <h4>{{ attendance.date|date:"d M Y" }}</h4>
        </div>

        <!-- Card Body -->
        <div class="card-body">
          <form method="post">
            {% csrf_token %}

            <!-- Status -->
            <div class="mb-3">
              <label for="status" class="form-label">Status</label>
              <select name="status" id="status" class="form-select" required>
                <option
                  value="Present"
                  {%
                  if
                  attendance.status=""
                  ="Present"
                  %}selected{%
                  endif
                  %}
                >
                  Present
                </option>
                <option
                  value="Late"
                  {%
                  if
                  attendance.status=""
                  ="Late"
                  %}selected{%
                  endif
                  %}
                >
                  Late
                </option>
                <option
                  value="Absent"
                  {%
                  if
                  attendance.status=""
                  ="Absent"
                  %}selected{%
                  endif
                  %}
                >
                  Absent
                </option>
              </select>
            </div>

            <!-- Check In -->
            <div class="mb-3">
              <label for="check_in" class="form-label"
                >Check In (YYYY-MM-DD HH:MM:SS)</label
              >
              <input
                type="text"
                class="form-control"
                id="check_in"
                name="check_in"
                value="{{ attendance.check_in|date:'Y-m-d H:i:s' }}"
                required
              />
            </div>

            <!-- Check Out -->
            <div class="mb-3">
              <label for="check_out" class="form-label"
                >Check Out (YYYY-MM-DD HH:MM:SS)</label
              >
              <input
                type="text"
                class="form-control"
                id="check_out"
                name="check_out"
                value="{{ attendance.check_out|date:'Y-m-d H:i:s' }}"
              />
            </div>

            <div class="d-flex justify-content-between">
              <a href="{% url 'dashboard' %}" class="btn btn-secondary">Back</a>
              <button type="submit" class="btn btn-success">
                Save Changes
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
